# Optional Full Mode recipe — paths are generated by dbt and are not committed.
source:
  type: dbt
  config:
    platform: postgres
    target_platform: postgres
    env: DEMO
    manifest_path: "${DBT_TARGET_DIR}/manifest.json"
    catalog_path: "${DBT_TARGET_DIR}/catalog.json"
    run_results_paths:
      - "${DBT_TARGET_DIR}/run_results.json"
    load_schemas: true
    use_identifiers: false

sink:
  type: datahub-rest
  config:
    server: "${DATAHUB_GMS_URL}"
    token: "${DATAHUB_GMS_TOKEN}"
